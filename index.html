<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purna Variety Store</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <header>
        <h1>Purna Variety Store</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#cart">Cart</a></li>
                <li><a href="#contact">Contact</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section id="home" class="banner">
            <h2>Welcome to Purna Variety Store</h2>
            <p>Your one-stop shop for maternity and baby clothes.</p>
            <button class="shop-now">Shop Now</button>
        </section>
        
        <section id="products">
            <h2>Our Products</h2>
            <div id="product-list" class="product-grid"></div>
        </section>

        <section id="cart">
            <h2>Your Cart</h2>
            <div id="cart-items" class="cart-grid"></div>
        </section>
        
        <section id="contact">
            <h2>Contact Us</h2>
            <form id="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
                
                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Purna Variety Store</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
